name: Release GNOME Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin zip unzip

      - name: Validate and package
        run: ./validate.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f dist/pinit-legacy.zip
          test -f dist/pinit-modern.zip
          test -f dist/SHA256SUMS

          echo "Release assets:"
          ls -lh dist/

          gh release create "${GITHUB_REF_NAME}" \
            dist/pinit-legacy.zip \
            dist/pinit-modern.zip \
            dist/SHA256SUMS \
            --title "PinIt ${GITHUB_REF_NAME}" \
            --generate-notes