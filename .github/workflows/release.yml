name: Release GNOME Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin zip unzip

      - name: Validate and package
        run: ./validate.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/pinit.zip \
            dist/SHA256SUMS \
            --generate-notes \
            --title "PinIt ${GITHUB_REF_NAME}"
